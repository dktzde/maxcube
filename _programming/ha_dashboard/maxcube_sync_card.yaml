# maxcube_sync_card.yaml
# Streamline-Template: Scheduler-Card + zweistufiger MaxCube Wochenprogramm-Sync
# Template-Variablen:
#   entity: Climate Entity ID (z.B. climate.untenbuero_untenburo10)
#   title:  Anzeigename (z.B. "Büro unten")
#
# Funktionsweise:
#   1. Zeigt Scheduler-Card für das Entity
#   2. Button "Vorschau" → ruft python_script.maxcube_preview auf (übergibt climate_entity_id)
#   3. Conditional Card erscheint wenn input_boolean.maxcube_preview_ready=on
#      UND input_text.maxcube_pending_entity == entity
#   4. Buttons Übertragen / Abbrechen in der Conditional Card
#
# Erstellt: 2026-03-09 durch Sonett 4.6

maxcube_sync_card:
  card:
    type: vertical-stack
    cards:
      # Scheduler-Card für dieses Thermostat
      - type: custom:scheduler-card
        title: '[[title]]'
        show_header_toggle: true
        include:
          - '[[entity]]'
        time_step: 30
        display_options:
          primary_info: '{action} ({time})'
          secondary_info: '{days}'
        style: |
          ha-card {
            border: none;
            background: transparent;
          }

      # Schritt 1: Vorschau-Button + Duty Cycle nebeneinander
      - type: horizontal-stack
        cards:
          - type: button
            name: "Scheduler → MaxCube Vorschau"
            icon: mdi:calendar-search
            tap_action:
              action: call-service
              service: python_script.maxcube_preview
              service_data:
                climate_entity_id: '[[entity]]'
          - type: entity
            entity: sensor.maxcube_duty_cycle
            name: Funkauslastung

      # Schritt 2: Conditional Card – erscheint nur wenn diese Entity im Preview-Modus ist
      - type: conditional
        conditions:
          - condition: state
            entity: input_boolean.maxcube_preview_ready
            state: "on"
          - condition: state
            entity: input_text.maxcube_pending_entity
            state: '[[entity]]'
        card:
          type: vertical-stack
          cards:
            - type: markdown
              content: "{{ states('input_text.maxcube_preview_text') }}{{ states('input_text.maxcube_preview_geraet') }}"
            - type: horizontal-stack
              cards:
                - type: button
                  name: "✓ Übertragen"
                  icon: mdi:check-bold
                  tap_action:
                    action: call-service
                    service: python_script.maxcube_confirm
                - type: button
                  name: "✗ Abbrechen"
                  icon: mdi:close
                  tap_action:
                    action: call-service
                    service: input_boolean.turn_off
                    service_data:
                      entity_id: input_boolean.maxcube_preview_ready
