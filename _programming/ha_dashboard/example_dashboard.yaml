# example_dashboard.yaml
# Minimales Dashboard für den MaxCube Scheduler-Sync.
# Zeigt pro Thermostat: Scheduler-Card + Vorschau-Button + Bestätigungs-Karte.
#
# Voraussetzungen:
#   - custom:scheduler-card  (HACS)
#   - Hilfsentitäten aus ha_helpers/maxcube_sync.yaml im packages/-Ordner
#   - python_scripts/maxcube_preview.py + maxcube_confirm.py
#
# Entity-IDs bitte durch eigene ersetzen.
# RF-Adresse unter: Developer Tools → States → climate.<entity> → device_rf_address

views:
  - title: Heizung Scheduler-Sync
    sections:

      - type: grid
        cards:
          - type: heading
            heading: Thermostate
            heading_style: title

          # ── Thermostat 1 ────────────────────────────────────────────────
          - type: vertical-stack
            cards:
              - type: custom:scheduler-card
                title: Zimmer 1                        # <-- anpassen
                include:
                  - climate.your_thermostat_1           # <-- anpassen
                time_step: 30

              - type: horizontal-stack
                cards:
                  - type: button
                    name: "Scheduler → MaxCube Vorschau"
                    icon: mdi:calendar-search
                    tap_action:
                      action: call-service
                      service: python_script.maxcube_preview
                      service_data:
                        climate_entity_id: climate.your_thermostat_1  # <-- anpassen
                  - type: entity
                    entity: sensor.maxcube_duty_cycle
                    name: Funkauslastung

              - type: conditional
                conditions:
                  - condition: state
                    entity: input_boolean.maxcube_preview_ready
                    state: "on"
                  - condition: state
                    entity: input_text.maxcube_pending_entity
                    state: climate.your_thermostat_1   # <-- anpassen
                card:
                  type: vertical-stack
                  cards:
                    - type: markdown
                      content: >
                        {{ states('input_text.maxcube_preview_text') }}
                        {{ states('input_text.maxcube_preview_geraet') }}
                    - type: horizontal-stack
                      cards:
                        - type: button
                          name: "✓ Übertragen"
                          icon: mdi:check-bold
                          tap_action:
                            action: call-service
                            service: python_script.maxcube_confirm
                        - type: button
                          name: "✗ Abbrechen"
                          icon: mdi:close
                          tap_action:
                            action: call-service
                            service: input_boolean.turn_off
                            service_data:
                              entity_id: input_boolean.maxcube_preview_ready

          # ── Thermostat 2 ────────────────────────────────────────────────
          # (Block oben kopieren und climate.your_thermostat_1 ersetzen)
